name: Brancher le nouvel assistant (ChatView)

# Migration ponctuelle : remplace l'ancienne ChatView de Dashboard.tsx par
# components/ChatView.tsx, verifie le typage avant/apres, puis pousse le resultat
# sur la branche "wire-chatview" (jamais sur main). A lancer une seule fois depuis
# l'onglet Actions ("Run workflow"), puis a supprimer.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer les dependances
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Typage avant la modification (reference)
        run: npx tsc --noEmit > tsc-before.txt || true

      - name: Appliquer la modification
        run: |
          python - <<'PY'
          import re

          # ---- components/Dashboard.tsx ----
          path = "components/Dashboard.tsx"
          s = open(path, encoding="utf-8").read()

          assert s.count("type ChatMessageItem = ") == 1, "type ChatMessageItem introuvable ou en double"
          assert s.count("function StoresView(") == 1, "function StoresView introuvable ou en double"
          a = s.index("type ChatMessageItem = ")
          b = s.index("function StoresView(")
          assert a < b, "ordre inattendu"
          block = s[a:b]
          assert "function ChatView(" in block, "l'ancienne ChatView n'est pas dans le bloc"
          rest = s[:a] + s[b:]

          for name in ["ChatMessageItem", "ChatUsage", "POSTER_FORMATS", "QuickPrompt", "AI_QUICK_PROMPTS"]:
              assert not re.search(r"\b" + name + r"\b", rest), name + " est utilise en dehors du bloc"
          s = rest

          old_import = 'import { cleanAiText } from "@/lib/ai/format";'
          assert s.count(old_import) == 1, "import cleanAiText introuvable"
          s = s.replace(old_import, 'import { ChatView } from "@/components/ChatView";')
          assert not re.search(r"\bcleanAiText\b", s), "cleanAiText encore utilise"

          m = re.search(r'import \{([^}]*)\} from "lucide-react";', s)
          assert m, "import lucide-react introuvable"
          names = [n.strip() for n in m.group(1).split(",") if n.strip()]
          without_import = s[:m.start()] + s[m.end():]
          removed = []
          for icon in ["Copy", "Clock3", "Wand2", "X"]:
              if icon in names and not re.search(r"\b" + icon + r"\b", without_import):
                  names.remove(icon)
                  removed.append(icon)
          s = s[:m.start()] + "import { " + ", ".join(names) + ' } from "lucide-react";' + s[m.end():]
          print("icones retirees :", removed)

          open(path, "w", encoding="utf-8").write(s)

          # ---- components/ChatView.tsx : faute dans un commentaire + chemin du document ----
          path = "components/ChatView.tsx"
          c = open(path, encoding="utf-8").read()
          assert c.count("mowèneraient") == 1, "faute introuvable"
          c = c.replace("mowèneraient", "mèneraient")
          assert c.count("voir VENDEO_AI_LAYOUT.md") == 1, "reference au document introuvable"
          c = c.replace("voir VENDEO_AI_LAYOUT.md", "voir docs/VENDEO_AI_LAYOUT.md")
          open(path, "w", encoding="utf-8").write(c)
          print("ok")
          PY

      - name: Typage apres la modification
        run: npx tsc --noEmit > tsc-after.txt || true

      - name: Comparer (aucune nouvelle erreur autorisee)
        run: |
          python - <<'PY'
          import re, sys

          def norm(path):
              out = set()
              for line in open(path, encoding="utf-8"):
                  m = re.match(r"^(.*?)\(\d+,\d+\): (error TS\d+: .*)$", line.strip())
                  if m:
                      out.add(m.group(1) + ": " + m.group(2))
              return out

          before = norm("tsc-before.txt")
          after = norm("tsc-after.txt")
          print(len(before), "erreur(s) avant,", len(after), "apres")
          new = sorted(after - before)
          if new:
              print("NOUVELLES ERREURS :")
              for e in new:
                  print(" ", e)
              sys.exit(1)
          print("Aucune nouvelle erreur de typage.")
          PY

      - name: Pousser sur la branche wire-chatview
        run: |
          rm -f tsc-before.txt tsc-after.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b wire-chatview
          git add -A
          git commit -m "refactor(assistant): brancher components/ChatView.tsx et retirer l'ancienne ChatView de Dashboard.tsx"
          git push origin wire-chatview
